name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "envs/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_emails: '["${{ secrets.ALERT_EMAIL }}"]'
  TF_VAR_budget_alert_emails: '["${{ secrets.ALERT_EMAIL }}"]'

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-uptime-${{ matrix.environment }}-plan
          aws-region: us-east-1

      - name: Initialize
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=platform/${{ matrix.environment }}/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comment plan summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENV_NAME: ${{ matrix.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' || echo "No summary found")
          printf '### Terraform plan: %s\n\n`%s`\n\nThe full plan, with secrets masked, is in the [workflow run](%s).\n' "$ENV_NAME" "$summary" "$RUN_URL" > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md

  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.diff.outputs.dev }}
      prod: ${{ steps.diff.outputs.prod }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: diff
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "$changed"
          for env in dev prod; do
            if echo "$changed" | grep -qE "^envs/${env}/|^\.github/workflows/terraform\.yml$"; then
              echo "${env}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${env}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  apply-dev:
    needs: changes
    if: needs.changes.outputs.dev == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-uptime-dev-apply
          aws-region: us-east-1

      - name: Initialize
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=platform/dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color tfplan

  apply-prod:
    needs: [changes, apply-dev]
    if: always() && needs.changes.outputs.prod == 'true' && needs.apply-dev.result != 'failure' && needs.apply-dev.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-uptime-prod-apply
          aws-region: us-east-1

      - name: Initialize
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=platform/prod/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color tfplan