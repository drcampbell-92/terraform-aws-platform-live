name: drift

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_emails: '["${{ secrets.ALERT_EMAIL }}"]'
  TF_VAR_budget_alert_emails: '["${{ secrets.ALERT_EMAIL }}"]'

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-uptime-${{ matrix.environment }}-plan
          aws-region: us-east-1

      - name: Initialize
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=platform/${{ matrix.environment }}/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Plan with detailed exit code
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Open, update, or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_NAME: ${{ matrix.environment }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Drift detected: ${ENV_NAME}"
          gh label create drift --color B60205 --description "Infrastructure differs from code" --force
          existing=$(gh issue list --state open --label drift --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)

          if [ "$EXIT_CODE" = "2" ]; then
            summary=$(terraform show -no-color tfplan | grep -E '^Plan:' || echo "Changes detected")
            printf 'The drift check found differences between the code and real infrastructure in `%s`.\n\n`%s`\n\nThe full plan, with secrets masked, is in the [workflow run](%s).\n' "$ENV_NAME" "$summary" "$RUN_URL" > body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file body.md
            else
              gh issue create --title "$title" --label drift --body-file body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "No drift found in the latest check: $RUN_URL"
          else
            echo "No drift in ${ENV_NAME}."
          fi